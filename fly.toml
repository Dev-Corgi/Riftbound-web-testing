# fly.toml app configuration file generated for riftbound-web-testing on 2026-11-11T02:58:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'riftbound-web-testing'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  # nginx in the container rewrites Host/Origin, so https:// works.
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1gb'
