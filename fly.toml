# Change `app` to a globally unique name (or let `fly launch --copy-config` set it).
app = "alpharune-riftbound"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  # The server only accepts a WebSocket whose Origin is "http://<Host>", so the
  # page must be opened over plain http://. Do not turn force_https on.
  force_https = false
  # The game lives in this process's memory: never auto-stop, never scale out.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
