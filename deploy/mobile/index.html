<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d14">
<title>Riftbound</title>
<style>
:root{
  --bg:#0b0d14; --bg2:#121623; --panel:#171c2c; --panel2:#1e2438; --line:#2b3350;
  --text:#eceff7; --mut:#8f98b3; --gold:#e6b85c; --me:#4fa3ff; --foe:#ff6f7d; --ok:#4fe0a0; --warn:#ffcb5c;
  --uw:50px;            /* unit card width on the board */
  --hw:74px;            /* hand card width */
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button{font:inherit;color:inherit}
.hide{display:none!important}

/* ───────── cards ───────── */
.c{position:relative;flex:none;width:var(--uw);aspect-ratio:744/1039;border-radius:6px;overflow:hidden;
  background:linear-gradient(160deg,#2a3354,#171c2c);border:1px solid #39426a;cursor:pointer;transition:transform .12s,box-shadow .12s}
.c img{display:block;width:100%;height:100%;object-fit:cover}
.c .nm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:3px;text-align:center;
  font-size:9px;line-height:1.1;font-weight:600;word-break:keep-all}
.c.big{width:var(--hw)}
.c.big .nm{font-size:11px}
.c .mt,.c .dm{position:absolute;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font-size:10px;font-weight:800;line-height:16px;text-align:center;
  background:#0b0d14e6;border:1px solid #4a5480}
.c .mt{left:2px;bottom:2px;color:var(--warn)}
.c .dm{right:2px;top:2px;color:var(--foe)}
.c.ex{filter:grayscale(.55) brightness(.7);transform:rotate(7deg) scale(.94)}
.c.mine{border-color:#3d79bd}
.c.foe{border-color:#b5515c}
.c.can{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 12px 2px #4fe0a066;animation:glow 1.8s ease-in-out infinite}
.c.sel{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.c.mull{opacity:.6;transform:translateY(8px) rotate(-3deg);border-color:var(--foe)}
.c .cnt{position:absolute;top:2px;left:2px;min-width:16px;height:16px;border-radius:8px;background:var(--ok);color:#06231a;font-size:10px;font-weight:800;text-align:center;line-height:16px}
@keyframes glow{50%{box-shadow:0 0 0 1px var(--ok),0 0 18px 4px #4fe0a099}}
.back{flex:none;width:17px;aspect-ratio:744/1039;border-radius:3px;border:1px solid #4a5480;margin-left:-8px;
  background:repeating-linear-gradient(45deg,#2c3868,#2c3868 4px,#222b52 4px,#222b52 8px)}
.back:first-child{margin-left:0}

/* ───────── layout ───────── */
#app{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--line);min-height:40px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none}
.dot.on{background:var(--ok)}
.turn{flex:1;min-width:0;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn b{color:var(--text)}
.turn .who-me{color:var(--me)} .turn .who-foe{color:var(--foe)}
.ibtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.board{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:6px 8px;
  background:radial-gradient(120% 80% at 50% 50%,#161c33 0%,var(--bg) 70%)}
.side{flex:none;background:#ffffff08;border:1px solid var(--line);border-radius:10px;padding:5px 7px}
.band{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.pic{display:flex;gap:4px;flex:none}
.pic .c{width:30px;border-radius:4px}
.nameblk{flex:1;min-width:0}
.pname{font-weight:800;font-size:13px}
.pname.me{color:var(--me)} .pname.foe{color:var(--foe)}
.pip{display:flex;align-items:center;gap:6px;margin-top:2px}
.bar8{flex:1;height:6px;border-radius:3px;background:#0b0d14;border:1px solid var(--line);overflow:hidden}
.bar8 i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffdb94)}
.pip span{font-size:12px;font-weight:800;color:var(--gold);min-width:30px;text-align:right}
.res{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.chip{font-size:10.5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--mut);white-space:nowrap}
.chip b{color:var(--text)}
.runes{display:flex;gap:3px;align-items:center}
.rune{width:13px;height:13px;border-radius:50%;border:1px solid #0008;flex:none}
.rune.ex{opacity:.3}
.lane{display:flex;gap:5px;overflow-x:auto;min-height:calc(var(--uw)*1.4 + 4px);align-items:center;padding:2px 0;scrollbar-width:none}
.lane::-webkit-scrollbar{display:none}
.lane.empty::after{content:"";}
.lane .none{color:#59628a;font-size:11px;padding-left:4px}

.bfs{flex:1 0 auto;display:flex;flex-direction:row;gap:6px;min-height:200px}
.bf{flex:1 1 0;min-width:0;min-height:0;position:relative;border-radius:10px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;padding:4px 7px}
.bf::before{content:"";position:absolute;inset:0;background:var(--bgimg,none) center/cover;opacity:.17;filter:blur(2.5px);z-index:0}
.bf>*{position:relative;z-index:1}
.bf.c-me{border-color:var(--me);box-shadow:0 0 0 1px #4fa3ff55 inset}
.bf.c-foe{border-color:var(--foe);box-shadow:0 0 0 1px #ff6f7d55 inset}
.bfh{display:flex;justify-content:space-between;align-items:center;gap:4px;padding-left:26px;min-height:22px;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.bfh .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bfh .tag{flex:none;font-size:10px;padding:0 6px;border-radius:999px;background:#000a}
.bfh .tag.me{color:var(--me)} .bfh .tag.foe{color:var(--foe)} .bfh .tag.none{color:var(--mut)}
.bf{--uw:44px;padding:4px 6px}
.bf .lanes{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0}
.bf .lane{flex:1;min-width:0;min-height:calc(var(--uw)*1.4 + 4px)}
.bf .lane+.lane{border-top:1px dashed #ffffff30}
.mag{position:absolute;top:4px;left:4px;z-index:3;width:22px;height:22px;padding:0;border-radius:50%;border:1px solid #ffffff55;background:#000b;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mag:active{background:#333c}
.eff{margin-top:8px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:13px;line-height:1.45;white-space:pre-line}
.bfimg{display:block;width:100%;max-height:34dvh;object-fit:contain;border-radius:10px;margin-bottom:6px;cursor:zoom-in}
.resrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:3px 0}
.side .lane{--uw:44px}

.handwrap{position:absolute;left:0;right:0;bottom:0;z-index:6;transition:transform .22s ease}
.handwrap.hidden{transform:translateY(100%)}
.stage.hh .board{padding-bottom:38px}
.htoggle{position:absolute;top:-30px;left:50%;transform:translateX(-50%);height:30px;padding:0 16px;border-radius:15px 15px 0 0;background:var(--panel);border:1px solid var(--line);border-bottom:0;color:var(--text);font-weight:700;font-size:12px;white-space:nowrap;cursor:pointer}
.htoggle:active{background:var(--panel2)}
.hand{display:flex;align-items:flex-end;padding:12px 14px 6px;overflow-x:auto;min-height:calc(var(--hw)*1.4 + 20px);background:#0b0d14f2;border-top:1px solid var(--line);scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.hand .c{margin-right:-16px}
.hand .c:last-child{margin-right:0}
.hand .c.can,.hand .c.sel{margin-bottom:6px}
.hand .empty{color:var(--mut);font-size:12px;margin:auto}

.actbar{display:flex;gap:8px;padding:8px 10px calc(8px + var(--safe-b));background:var(--bg2);border-top:1px solid var(--line);align-items:center}
.status{flex:1;min-width:0;font-size:12.5px;color:var(--mut)}
.status.go{color:var(--ok);font-weight:700}
.btn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer}
.btn:active{filter:brightness(1.25)}
.btn.pri{background:linear-gradient(180deg,#f0c56d,#cf9a2f);color:#241a05;border-color:#f0c56d}
.btn.go{background:linear-gradient(180deg,#52e2a3,#2bb67a);color:#04281a;border-color:#52e2a3}
.btn[disabled]{opacity:.45}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ───────── sheets & overlays ───────── */
.shade{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shade.center{align-items:center}
.sheet{width:100%;max-width:560px;max-height:78dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;
  border-radius:16px 16px 0 0;padding:14px 14px calc(14px + var(--safe-b))}
.sheet h3{margin:0 0 10px;font-size:15px}
.cardrow{display:flex;gap:12px;margin-bottom:12px}
.cardrow .c{width:104px;cursor:zoom-in}
.cardrow .info{flex:1;min-width:0}
.cardrow .info b{font-size:15px}
.cardrow .info div{color:var(--mut);font-size:12.5px;margin-top:3px}
.acts{display:flex;flex-direction:column;gap:7px}
.act{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:6px 12px;text-align:left;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;cursor:pointer}
.act:active{background:#2a3350}
.act.end{border-color:var(--gold)}
.act img{width:28px;height:39px;object-fit:cover;border-radius:3px;flex:none}
.act small{display:block;color:var(--mut);font-size:11px}
.prompt{padding:8px 10px;border-left:3px solid var(--warn);background:var(--panel2);border-radius:6px;margin-bottom:10px}
.note{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:35;background:#162a4a;border:1px solid var(--me);color:#d7e8ff;padding:6px 12px;border-radius:8px;font-size:13px;max-width:90vw;pointer-events:none}
.oppcard{width:min(92vw,380px);max-height:94dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;text-align:center;margin:auto}
.oppttl{font-size:12px;color:var(--foe);font-weight:800;letter-spacing:.5px}
.oppkind{font-size:17px;font-weight:800;color:var(--warn);margin:2px 0 10px}
.oppname{font-weight:800;font-size:15px;margin-top:8px}
.oppcard .eff{width:100%;text-align:left}
.evrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.ev{flex:none;width:96px;text-align:center}
.ev .c{width:96px;cursor:zoom-in}
.ev .cap{font-size:12px;margin-top:4px;line-height:1.25}
.ev .cap b{display:block;color:var(--warn);font-size:11.5px}
.cback{width:96px;aspect-ratio:744/1039;border-radius:6px;border:1px solid #4a5480;background:repeating-linear-gradient(45deg,#2c3868,#2c3868 6px,#222b52 6px,#222b52 12px)}
.evtxt{padding:6px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px}
.zoom{flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:14px}
.zoom img{max-width:90vw;max-height:78dvh;border-radius:14px}
.msg{padding:18px;border-radius:16px;background:var(--panel);border:1px solid var(--line);text-align:center;max-width:340px;margin:auto}
.msg h2{margin:0 0 6px;font-size:26px}
.msg.win h2{color:var(--ok)} .msg.lose h2{color:var(--foe)}
.msg .btn{margin:6px 4px 0}
.toast{position:fixed;left:50%;top:48px;transform:translateX(-50%);z-index:40;background:#3a1c22;border:1px solid var(--foe);color:#ffd5da;padding:6px 12px;border-radius:8px;font-size:13px;max-width:90vw}
pre.txt{font:11px/1.25 ui-monospace,Menlo,Consolas,monospace;overflow:auto;color:#cfd5e8;margin:0}

/* ───────── setup screen ───────── */
#setup{height:100dvh;overflow-y:auto;padding:18px 14px calc(24px + var(--safe-b));max-width:560px;margin:0 auto;
  background:radial-gradient(120% 60% at 50% 0,#1a2140 0,transparent 70%)}
#setup h1{margin:4px 0 2px;font-size:24px;letter-spacing:.5px}
#setup .sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:center}
.slot .lbl{font-size:12px;font-weight:800;margin-bottom:8px}
.slot.me .lbl{color:var(--me)} .slot.foe .lbl{color:var(--foe)}
.slot .c{width:100%;max-width:120px;margin:0 auto 8px;cursor:pointer}
.slot .dn{font-weight:800;font-size:14px}
.slot .ds{color:var(--mut);font-size:11.5px;min-height:15px}
.slot .chg{display:inline-block;margin-top:6px;font-size:12px;color:var(--gold)}
.lv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.lv button{padding:10px 2px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700}
.lv button.on{border-color:var(--gold);background:#2a2412;color:var(--gold)}
.lvd{color:var(--mut);font-size:12.5px;min-height:34px;margin-bottom:12px}
#setup h4{margin:14px 0 8px;font-size:13px;color:var(--mut)}
.err{background:#3a1c22;border:1px solid var(--foe);color:#ffd5da;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;word-break:break-word}
.go-btn{width:100%;min-height:54px;font-size:17px}
.picker{width:100%;max-width:560px;height:86dvh;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.picker header{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.picker input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font:inherit}
.grid{overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start}
.tile{cursor:pointer;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px}
.tile.on{border-color:var(--gold)}
.tile .c{width:100%;margin-bottom:4px}
.tile .tn{font-size:11.5px;font-weight:700;line-height:1.2}
.tile .ts{font-size:10px;color:var(--mut)}
</style>
</head>
<body>

<div id="setup" class="hide"></div>

<div id="app" class="hide">
  <div class="top">
    <span id="dot" class="dot"></span>
    <span id="turn" class="turn">연결 중…</span>
    <button class="ibtn" id="menuBtn">메뉴</button>
  </div>
  <div class="stage">
    <div class="board" id="board"></div>
    <div class="handwrap" id="handwrap">
      <button class="htoggle" id="htoggle"></button>
      <div class="hand" id="hand"></div>
    </div>
  </div>
  <div class="actbar" id="actbar"></div>
</div>

<div id="layer"></div>
<div id="toast" class="toast hide"></div>
<div id="note" class="note hide"></div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const IMG = {};                               // card name -> image URL
const LEVELS = [
  ['easy',   '쉬움',   '아무 행동이나 고르는 AI예요. 규칙 연습용으로 좋아요.'],
  ['normal', '보통',   '조금 앞을 내다보며 두는 AI예요. (탐색 50회)'],
  ['hard',   '어려움', '꽤 신중하게 두는 AI예요. (탐색 200회)'],
  ['expert', '최상',   '가장 강한 단계예요. 한 수에 몇 초 걸릴 수 있어요. (탐색 500회)'],
];
// All AI levels play fair: they do not see your hand.
const RUNE_COLOR = {Fury:'#e5484d', Calm:'#3ecf8e', Mind:'#4f9dff', Body:'#f5963b', Chaos:'#b36bff', Order:'#f2d04b'};

const S = {
  decks: [], picks: {deck1: null, deck2: null, level: 'normal'},
  me: 'P1', frame: null, pending: false, over: false,
  cfg: null, sel: null, sheet: null, mull: [],
  ws: null, retry: 0, started: false, handOpen: true,
  queue: [], oppCur: null, history: [], notify: true,
};

// ───────── tiny helpers ─────────
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
};
async function api(path, opts) {
  const r = await fetch(path, opts);
  return r.json();
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.add('hide'), 3500);
}
// Legends are stored in the gallery by title only ("Grand Duelist"), decks say "Fiora, Grand Duelist".
const imgFor = n => IMG[n] || (n && n.includes(', ') ? IMG[n.split(', ').slice(1).join(', ')] : undefined);
const other = p => (p === 'P1' ? 'P2' : 'P1');
const pretty = s => s.replace(/\(obj=\d+\)/g, '').replace(/ #\d+/g, '').replace(/\s+/g, ' ').trim();

function cardEl(o, opt = {}) {
  const url = imgFor(o.name);
  const c = h('div', {class: 'c' + (opt.big ? ' big' : '') + (o.exhausted ? ' ex' : '') + (opt.can ? ' can' : '') +
    (opt.sel ? ' sel' : '') + (opt.mull ? ' mull' : '') + (opt.side ? ' ' + opt.side : ''), title: o.name,
    onclick: opt.onclick || (() => openCard(o))});
  if (url) {
    const img = h('img', {src: url, alt: o.name, loading: 'lazy', decoding: 'async', draggable: 'false'});
    img.addEventListener('error', () => { img.remove(); c.append(h('span', {class: 'nm'}, o.name)); });
    c.append(img);
  } else c.append(h('span', {class: 'nm'}, o.name));
  if (o.might) c.append(h('span', {class: 'mt'}, o.might));
  if (o.damage) c.append(h('span', {class: 'dm'}, '-' + o.damage));
  if (opt.count > 1) c.append(h('span', {class: 'cnt'}, opt.count));
  return c;
}

// ───────── model: what can I do right now? ─────────
function kindOf(a) { return ((a.type || '').match(/^P\d:\s*(\w+)/) || [])[1] || ''; }

function buildModel(f) {
  const me = S.me, idx = new Map(), vis = [];        // vis: my visible cards (name fallback)
  const add = (o, mine) => { if (o && o.id != null) { idx.set(o.id, o); if (mine) vis.push(o); } };
  for (const p of ['P1', 'P2']) {
    const z = (f.zones || {})[p] || {};
    for (const k of ['hand', 'base', 'trash', 'banishment']) (z[k] || []).forEach(o => add(o, p === me && k !== 'trash'));
  }
  for (const b of (f.battlefields || [])) (b.units || []).forEach(o => add(o, o.controller === me));
  const champ = champInfo(f, me);
  const m = {idx, byObj: new Map(), champ: [], bar: [], choice: [], mull: [], other: [], all: [], champName: champ && champ.name};
  const attach = (key, p) => { if (!m.byObj.has(key)) m.byObj.set(key, []); m.byObj.get(key).push(p); };
  const legal = f.type === 'decision' ? (f.legal || []) : [];
  for (const a of legal) {
    const k = kindOf(a), p = {a, kind: k, label: a.label};
    m.all.push(p);
    if (k === 'EndTurn' || k === 'PassPriority' || k === 'PassFocus') { m.bar.push(p); continue; }
    if (k === 'MulliganDecision') { m.mull.push(p); continue; }
    if (k === 'MakeChoice' || k === 'AssignCombatDamage') {
      const om = a.label.match(/\(obj=(\d+)\)/); p.obj = om ? idx.get(+om[1]) : null;
      m.choice.push(p); continue;
    }
    let obj = null, name = null;
    if (k === 'PlayCard' || k === 'PlayReaction') {
      obj = idx.get(a.card_object_id);
      name = (a.label.match(/^Play (.+?) #\d+/) || [])[1];
      p.dest = (a.label.match(/->\s*(.+)$/) || [])[1];
    } else if (k === 'ActivateAbility') {
      obj = idx.get(a.ability_source);
      name = (a.label.match(/^Activate (.+?) #\d+/) || [])[1];
      p.target = (a.label.match(/@\s*(.+)$/) || [])[1];
      if (p.target) p.target = pretty(p.target);
    } else if (k === 'StandardMove') {
      const mm = a.label.match(/^Move (.+?) #\d+ -> (.+)$/);
      name = mm && mm[1]; p.dest = mm && mm[2];
      const units = vis.filter(o => o.name === name && o.id != null && !(((f.zones||{})[me]||{}).hand||[]).includes(o));
      if (units.length) { units.forEach(u => attach(u.id, p)); continue; }
    }
    if (obj && obj.id != null) { attach(obj.id, p); continue; }
    if (name && champ && champ.name === name) { m.champ.push(p); continue; }
    const byName = name && vis.find(o => o.name === name);
    if (byName) { attach(byName.id, p); continue; }
    m.other.push(p);
  }
  m.cardBound = [...m.byObj.values()].reduce((n, v) => n + v.length, 0) + m.champ.length;
  m.mode = m.mull.length ? 'mull' : (m.choice.length && !m.cardBound && !m.bar.length ? 'choice' : (legal.length ? 'main' : 'wait'));
  return m;
}

function champInfo(f, who) {
  // legend / champion are not in `zones`; read them from the text board.
  const t = f.render_text || '';
  const lines = t.split('\n');
  const i = lines.findIndex(l => l.startsWith('| ' + who + ' '));
  const out = {legend: null, champ: null, name: null, ready: false};
  if (i < 0) return out;
  const cfg = S.cfg && S.deckOf(who);
  out.legend = cfg ? cfg.legend : null;
  for (let j = i; j < Math.min(i + 4, lines.length); j++) {
    const m = lines[j].match(/Champion Zone:\s+(.+?)\s+\[([^\]]*)\]/);
    if (m) { out.name = m[1]; out.ready = /READY/.test(m[2]); }
  }
  out.champ = out.name;
  return out;
}

// ───────── opponent actions (from the public engine log) ─────────
const LG = {cur: null, last: null};
function pushEv(e) {
  const last = S.queue[S.queue.length - 1] || S.oppCur;
  if (last && last.t === e.t && last.name === e.name && last.bf === e.bf) return;      // collapse repeats
  const isBf = e.t === 'trigger' && ((S.frame || {}).battlefields || []).some(b => b.name.replace(/\s*\(.*\)$/, '') === e.name);
  if (isBf) {                                  // passive battlefield effects fire on every spell: banner only
    const msg = '전장 효과: ' + e.name; S.history.push(msg); S.history = S.history.slice(-60);
    if (S.notify) note(msg);
    return;
  }
  if (e.t === 'combat' || e.t === 'conquer') {            // no card: short banner, does not block
    S.history.push(evText(e)); S.history = S.history.slice(-60);
    if (S.notify) note(evText(e));
    return;
  }
  S.queue.push(e);
  setTimeout(pumpOpp, 150);        // let the TARGET line (it follows the card line) attach first
}
function pumpOpp() {
  if (!S.notify) { S.queue = []; return; }
  if (S.oppCur || !S.queue.length) return;
  S.oppCur = S.queue.shift();
  S.history.push(evText(S.oppCur)); S.history = S.history.slice(-60);
  if (S.frame) render(); else openOpp(S.oppCur);
}
function nextOpp() { S.oppCur = null; closeLayer(); pumpOpp(); if (!S.oppCur) render(); }
function skipOpp() { S.queue = []; S.oppCur = null; closeLayer(); render(); }
function note(msg) {
  const t = $('note'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(note.id); note.id = setTimeout(() => t.classList.add('hide'), 2600);
}
function parseLog(raw) {
  const l = String(raw || '').replace(/^\[D:[\d.]+\]\s*/, ''), opp = other(S.me);
  let m;
  if ((m = l.match(/^CHOSE: \[(P\d)\] (\w+)/))) {
    LG.cur = m[1];
    if (m[1] === opp && m[2] === 'ActivateAbility') {
      const name = Object.keys(IMG).sort((a, b) => b.length - a.length).find(n => l.includes(n));
      if (name) pushEv({t: 'trigger', name});
    }
    return;
  }
  if ((m = l.match(/^INTENT: \w+ by (P\d)/))) { LG.cur = m[1]; return; }
  if ((m = l.match(/^TRIGGER: (.+?) \((P\d)\) fires ability/))) { if (m[2] === opp) pushEv({t: 'trigger', name: m[1]}); return; }
  if ((m = l.match(/^HIDE: (P\d) hides a card at BF#(\d+)/))) { if (m[1] === opp) pushEv({t: 'hide', bf: +m[2]}); return; }
  if ((m = l.match(/^CONQUER: (P\d) conquers BF#(\d+)/))) { if (m[1] === opp) pushEv({t: 'conquer', bf: +m[2]}); return; }
  if ((m = l.match(/^COMBAT: BF#(\d+) attacker=(P\d)/))) { if (m[2] === opp) pushEv({t: 'combat', bf: +m[1]}); return; }
  if ((m = l.match(/^TARGET \((?:play|finalize)\): (.+?) -> (.+)$/))) {
    const pool = S.queue.concat(S.oppCur ? [S.oppCur] : []);
    for (let i = pool.length - 1; i >= 0; i--) if (pool[i].name === m[1] && !pool[i].target) { pool[i].target = m[2]; break; }
    return;
  }
  if (LG.cur !== opp) return;
  if ((m = l.match(/^PLAY: (.+?) \(id=\d+, (\w+)/))) pushEv({t: 'play', name: m[1], type: m[2]});
  else if ((m = l.match(/^SPELL: (.+?) \(id=\d+\)/))) pushEv({t: 'spell', name: m[1]});
  else if ((m = l.match(/^MOVE: (.+?) \(id=\d+\) -> BF#(\d+)/))) pushEv({t: 'move', name: m[1], bf: +m[2]});
}
const bfName = id => {
  const b = ((S.frame || {}).battlefields || []).find(x => x.id === id);
  return b ? b.name.replace(/\s*\(.*\)$/, '') : '전장 ' + (id + 1);
};
const TYPE_KO = {Unit: '유닛', Spell: '주문', Gear: '장비', Legend: '레전드', Champion: '챔피언'};
const EV_LABEL = {play: '낸 카드', spell: '쓴 주문', trigger: '효과 발동', move: '이동', hide: '숨긴 카드'};
function evText(e) {
  switch (e.t) {
    case 'play': return '상대가 ' + e.name + (TYPE_KO[e.type] ? ' (' + TYPE_KO[e.type] + ')' : '') + '을(를) 냈어요';
    case 'spell': return '상대가 주문 ' + e.name + (e.target ? ' → ' + e.target : '') + ' 사용';
    case 'trigger': return '상대의 ' + e.name + ' 효과 발동' + (e.target ? ' → ' + e.target : '');
    case 'move': return '상대의 ' + e.name + ' → ' + bfName(e.bf) + ' 이동';
    case 'hide': return '상대가 ' + bfName(e.bf) + '에 카드를 숨겼어요';
    case 'combat': return '상대가 ' + bfName(e.bf) + '을(를) 공격했어요';
    case 'conquer': return '상대가 ' + bfName(e.bf) + '을(를) 점령했어요';
  }
  return '';
}
function openOpp(e) {
  const effEl = h('div', {class: 'eff', style: 'font-size:12px;max-height:22dvh;overflow:auto'});
  const sub = e.t === 'move' ? '→ ' + bfName(e.bf) : e.t === 'hide' ? bfName(e.bf) : (e.target ? '대상: ' + e.target : (TYPE_KO[e.type] || ''));
  const big = e.t === 'hide' ? h('div', {class: 'cback', style: 'width:min(46vw,200px)'})
    : h('div', {class: 'c', style: 'width:min(58vw,240px);cursor:zoom-in', onclick: () => zoom({name: e.name})},
        imgFor(e.name) ? h('img', {src: imgFor(e.name), alt: e.name}) : h('span', {class: 'nm', style: 'font-size:16px'}, e.name));
  const more = S.queue.length;
  layer(h('div', {class: 'oppcard'},
    h('div', {class: 'oppttl'}, '상대의 행동'),
    h('div', {class: 'oppkind'}, EV_LABEL[e.t] || ''),
    big, h('div', {class: 'oppname'}, e.t === 'hide' ? '뒷면으로 숨긴 카드' : e.name),
    sub && h('div', {style: 'color:var(--mut);font-size:13px;margin-top:2px'}, sub),
    e.name && effEl,
    h('div', {style: 'display:flex;gap:8px;width:100%;margin-top:10px'},
      more > 0 && h('button', {class: 'btn', style: 'flex:none', onclick: skipOpp}, '모두 건너뛰기 (' + more + ')'),
      h('button', {class: 'btn go', style: 'flex:1', onclick: nextOpp}, more > 0 ? '확인 · 다음' : '확인'))),
    {center: true, onclose: false});
  if (e.name) effectInto(effEl, e.name);
}
function openHistory() {
  layer(h('div', {class: 'sheet'}, h('h3', {}, '상대 행동 기록'),
    S.history.length ? S.history.slice().reverse().map(t => h('div', {class: 'evtxt'}, t)) : h('div', {class: 'evtxt'}, '아직 기록이 없어요')), {});
}

// ───────── networking ─────────
function doChoose(p) {
  const f = S.frame;
  if (S.pending || !S.ws || S.ws.readyState !== 1) return;
  if (p.kind === 'EndTurn' && !confirm('턴을 종료할까요?')) return;
  S.pending = true; S.sel = null; S.sheet = null;
  S.ws.send(JSON.stringify({type: 'choose', player: f.player, index: p.a.index, decision_id: f.decision_id}));
  closeLayer(); render();
}
// Some hosts put idle services to sleep and ignore WebSocket traffic; plain HTTP pings keep them awake while a game is open.
setInterval(() => { if (!$('app').classList.contains('hide')) fetch('/api/status', {cache: 'no-store'}).catch(() => {}); }, 25000);

function connect() {
  if (S.ws) { S.ws.onclose = null; try { S.ws.close(); } catch (_) {} }
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const ws = S.ws = new WebSocket(proto + '//' + location.host + '/ws');
  ws.onopen = () => { S.retry = 0; $('dot').classList.add('on'); ws.send('{"type":"request_state"}'); };
  ws.onclose = async () => {
    $('dot').classList.remove('on');
    if (S.ws !== ws || S.over) return;
    let st = null; try { st = await api('/api/status'); } catch (_) {}
    if (S.ws !== ws) return;
    if (st && st.state === 'running') { setTimeout(connect, Math.min(1000 * ++S.retry, 5000)); return; }
    if (st) { toast('게임이 종료됐어요'); gotoSetup(); } else setTimeout(connect, 2000);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.type === 'log') { parseLog(m.msg); return; }
    if (m.type === 'decision' || m.type === 'state') {
      if (m.type === 'decision' && m.legal && m.legal.length) S.me = m.player || S.me;
      if (!S.frame || m.decision_id !== S.frame.decision_id) { S.mull = []; S.sel = null; S.sheet = null; }
      S.pending = false; S.frame = m;
      if (m.game_over) S.over = true;
      render();
    } else if (m.type === 'err') { S.pending = false; toast(m.msg || '오류'); render(); }
  };
}

// ───────── setup screen ─────────
S.deckOf = who => {
  if (!S.cfg) return null;
  const id = who === 'P1' ? S.cfg.deck1 : S.cfg.deck2;
  return S.decks.find(d => d.id === id) || null;
};
const deckById = id => S.decks.find(d => d.id === id);

function deckTile(d, label, cls) {
  return h('div', {class: 'slot ' + cls, onclick: () => pickDeck(label === '내 덱' ? 'deck1' : 'deck2')},
    h('div', {class: 'lbl'}, label),
    d ? cardEl({name: d.champion}, {onclick: () => {}}) : h('div', {class: 'c'}),
    h('div', {class: 'dn'}, d ? d.champion : '선택하세요'), h('div', {class: 'ds'}, d ? d.legend : ''),
    h('span', {class: 'chg'}, '덱 바꾸기'));
}
function renderSetup(err, running) {
  $('app').classList.add('hide'); $('setup').classList.remove('hide'); closeLayer();
  const P = S.picks, lv = LEVELS.find(l => l[0] === P.level) || LEVELS[1];
  const root = $('setup'); root.replaceChildren(...[
    h('h1', {}, 'Riftbound'), h('p', {class: 'sub'}, '덱과 상대 AI를 고르고 게임을 시작하세요.'),
    err && h('div', {class: 'err'}, err),
    h('div', {class: 'slots'}, deckTile(deckById(P.deck1), '내 덱', 'me'), deckTile(deckById(P.deck2), '상대 덱', 'foe')),
    h('div', {style: 'display:flex;justify-content:flex-end;margin:-8px 0 10px'},
      h('button', {class: 'btn', style: 'min-height:34px;font-size:12px', onclick: () => { P.deck2 = S.decks[Math.floor(Math.random() * S.decks.length)].id; renderSetup(); }}, '상대 덱 무작위')),
    h('h4', {}, '상대 AI 수준'),
    h('div', {class: 'lv'}, LEVELS.map(l => h('button', {class: l[0] === P.level ? 'on' : '', onclick: () => { P.level = l[0]; renderSetup(); }}, l[1]))),
    h('div', {class: 'lvd'}, lv[2]),
    h('button', {class: 'btn pri go-btn', id: 'startBtn', onclick: startGame}, '게임 시작'),
    running && h('button', {class: 'btn go-btn', style: 'margin-top:10px;min-height:46px;font-size:14px', onclick: resumeGame}, '진행 중인 게임으로 돌아가기'),
    h('p', {class: 'sub', style: 'margin-top:14px;font-size:12px'}, '게임을 시작하면 지금 진행 중인 게임은 종료돼요. 상대 AI는 내 손패를 볼 수 없어요.')].filter(Boolean));
}
function pickDeck(slot) {
  const input = h('input', {type: 'search', placeholder: '챔피언 이름 검색'});
  const grid = h('div', {class: 'grid'});
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    grid.replaceChildren(...S.decks.filter(d => !q || (d.champion + d.legend + d.id).toLowerCase().includes(q)).map(d =>
      h('div', {class: 'tile' + (S.picks[slot] === d.id ? ' on' : ''), onclick: () => { S.picks[slot] = d.id; closeLayer(); renderSetup(); }},
        cardEl({name: d.champion}, {onclick: () => {}}), h('div', {class: 'tn'}, d.champion), h('div', {class: 'ts'}, d.legend))));
  };
  input.addEventListener('input', draw); draw();
  layer(h('div', {class: 'picker'}, h('header', {}, input, h('button', {class: 'btn', onclick: closeLayer}, '닫기')), grid), {onclose: closeLayer});
}
async function startGame() {
  const P = S.picks, btn = $('startBtn');
  btn.disabled = true; btn.textContent = '게임을 준비하는 중… (몇 초 걸려요)';
  store.set('rb.picks', JSON.stringify(P));
  let r;
  try { r = await api('/api/start', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(P)}); }
  catch (e) { r = {ok: false, error: '서버에 연결하지 못했어요'}; }
  if (!r.ok) { renderSetup('시작하지 못했어요: ' + (r.error || '알 수 없는 오류')); return; }
  S.cfg = {deck1: P.deck1, deck2: P.deck2, level: P.level};
  enterGame();
}
function resumeGame() { enterGame(); }
function enterGame() {
  S.queue = []; S.oppCur = null; S.history = []; LG.cur = null;
  S.frame = null; S.over = false; S.overShown = false; S.pending = false; S.sel = null; S.sheet = null; S.mull = []; S.me = 'P1';
  $('setup').classList.add('hide'); $('app').classList.remove('hide');
  $('turn').textContent = '게임 준비 중…'; $('board').replaceChildren(); $('hand').replaceChildren();
  $('actbar').replaceChildren(h('div', {class: 'status'}, h('span', {class: 'spin'}), '불러오는 중…'));
  connect();
}
function gotoSetup() {
  if (S.ws) { S.ws.onclose = null; try { S.ws.close(); } catch (_) {} S.ws = null; }
  closeLayer(); renderSetup();
}
$('menuBtn').addEventListener('click', () => {
  const f = S.frame;
  layer(h('div', {class: 'sheet'}, h('h3', {}, '메뉴'), h('div', {class: 'acts'},
    h('button', {class: 'act', onclick: () => { closeLayer(); if (confirm('지금 게임을 끝내고 새 게임을 시작할까요?')) gotoSetup(); }}, '새 게임 설정'),
    h('button', {class: 'act', onclick: openHistory}, '상대 행동 기록'),
    h('button', {class: 'act', onclick: () => { S.notify = !S.notify; store.set('rb.notify', S.notify ? '1' : '0'); closeLayer(); toast('상대 행동 알림 ' + (S.notify ? '켜짐' : '꺼짐')); }}, '상대 행동 알림 끄기/켜기 (지금 ' + (S.notify ? '켜짐' : '꺼짐') + ')'),
    h('button', {class: 'act', onclick: () => { layer(h('div', {class: 'sheet'}, h('h3', {}, '텍스트 보드'), h('pre', {class: 'txt'}, (f && f.render_text) || '')), {}); }}, '텍스트 보드 보기'),
    h('button', {class: 'act', onclick: () => { location.href = '/classic'; }}, '기존(PC용) 화면 열기'))), {});
});

// ───────── boot ─────────
(async function boot() {
  S.handOpen = store.get('rb.hand') !== '0';
  S.notify = store.get('rb.notify') !== '0';
  try { Object.assign(IMG, await api('/api/images')); } catch (_) {}
  try { S.decks = await api('/api/decks'); } catch (_) {}
  const saved = (() => { try { return JSON.parse(store.get('rb.picks') || 'null'); } catch (_) { return null; } })();
  const first = id => S.decks.find(d => d.id === id) ? id : null;
  S.picks.deck1 = first(saved && saved.deck1) || first('fiora') || (S.decks[0] && S.decks[0].id);
  S.picks.deck2 = first(saved && saved.deck2) || first('yi_rebuild') || (S.decks[1] && S.decks[1].id);
  if (saved && LEVELS.some(l => l[0] === saved.level)) S.picks.level = saved.level;
  let st = null; try { st = await api('/api/status'); } catch (_) {}
  if (st && st.state === 'running' && st.config) { S.cfg = st.config; resumeGame(); }
  else renderSetup(st && st.error ? '이전 시작 오류: ' + st.error : null);
})();
})();
</script>
