<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Riftbound</title>
<style>
:root{
  --bg:#0e0f13; --panel:#171922; --panel2:#20232f; --line:#2c3040;
  --text:#e9ebf1; --mut:#98a0b3; --me:#5aa9ff; --foe:#ff7f7f; --ok:#58d39b; --warn:#ffc857;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
#dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
#dot.on{background:var(--ok)}
#turn{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#score{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#score .me{color:var(--me)} #score .foe{color:var(--foe)}
main{flex:1;overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-weight:700;font-size:14px}
.sec-h .tag{font-weight:500;font-size:12px;color:var(--mut)}
.foe-h{color:var(--foe)} .me-h{color:var(--me)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut)}
.chip b{color:var(--text);font-weight:600}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;min-height:26px}
.row.empty::after{content:"—";color:var(--mut);font-size:12px;align-self:center}
.bf{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.bf:last-child{margin-bottom:0}
.bf-h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.ctl-me{color:var(--me)} .ctl-foe{color:var(--foe)} .ctl-none{color:var(--mut)}
.lane{display:flex;align-items:flex-start;gap:8px;margin:4px 0}
.lane-l{flex:none;width:34px;font-size:11px;color:var(--mut);padding-top:4px}
.lane .row{flex:1;min-width:0}

.card{position:relative;flex:none;width:76px;border-radius:7px;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line);cursor:pointer;aspect-ratio:744/1039}
.card.big{width:96px}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.card .nm{position:absolute;inset:auto 0 0 0;padding:14px 4px 3px;font-size:10px;line-height:1.15;text-align:center;
  background:linear-gradient(transparent,rgba(0,0,0,.85));word-break:keep-all}
.card.noimg .nm{position:static;padding:8px 4px;background:none;font-size:11px}
.card.noimg{aspect-ratio:auto;min-height:90px;display:flex;align-items:center;justify-content:center}
.card.ex{opacity:.5;filter:grayscale(.5)}
.card .b{position:absolute;top:3px;font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;line-height:17px;background:rgba(0,0,0,.78);border:1px solid var(--line)}
.card .might{left:3px;color:var(--warn)} .card .dmg{right:3px;color:var(--foe)}
.card .exh{position:absolute;left:3px;bottom:22px;font-size:10px;background:rgba(0,0,0,.78);border-radius:4px;padding:0 4px;color:var(--mut)}
.deco-me{border-color:var(--me)} .deco-foe{border-color:var(--foe)}

details{margin-top:2px}
summary{cursor:pointer;color:var(--mut);font-size:13px;padding:4px 0}
pre{margin:6px 0 0;overflow-x:auto;font:11px/1.25 ui-monospace,Menlo,Consolas,monospace;color:#cfd3df}

footer{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + var(--safe-b));max-height:40dvh;overflow-y:auto}
#status{font-size:13px;color:var(--mut);margin-bottom:6px}
#status.me{color:var(--ok);font-weight:700}
#prompt{font-size:14px;margin:0 0 8px;padding:8px;border-left:3px solid var(--warn);background:var(--panel2);border-radius:6px}
#acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 10px;text-align:left;
  color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;font:inherit;cursor:pointer}
.act:active{background:#2a3042}
.act[disabled]{opacity:.45}
.act.end{border-color:var(--warn)}
.act img{width:30px;height:42px;object-fit:cover;border-radius:3px;flex:none}
.act .t{flex:1;min-width:0;word-break:break-word}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;
  animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.banner{padding:12px;border-radius:10px;text-align:center;font-weight:800;font-size:18px;margin-bottom:8px}
.banner.win{background:#16382a;color:var(--ok)} .banner.lose{background:#3a1c1c;color:var(--foe)}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:16px}
#modal.show{display:flex}
#modal img{max-width:92vw;max-height:76dvh;border-radius:12px}
#modal .cap{font-weight:700} #modal small{color:var(--mut)}
#toast{position:fixed;left:50%;top:56px;transform:translateX(-50%);background:#3a1c1c;color:#ffd0d0;border:1px solid var(--foe);
  padding:6px 12px;border-radius:8px;font-size:13px;display:none;z-index:10;max-width:90vw}
a.classic{color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="dot" title="연결 상태"></span>
    <span id="turn">연결 중…</span>
    <span id="score"></span>
  </header>
  <main id="main"></main>
  <footer>
    <div id="status"></div>
    <div id="prompt" hidden></div>
    <div id="acts"></div>
  </footer>
</div>
<div id="modal"><img id="mimg" alt=""><div class="cap" id="mcap"></div><small>화면을 누르면 닫혀요</small></div>
<div id="toast"></div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const IMG = {};                 // card name -> image url
  let NAMES = [];                 // card names, longest first
  let frame = null;               // last decision/state frame
  let me = 'P1';
  let pending = false;            // a choose was sent and not yet answered
  let ws = null, retry = 0;

  // Tiny DOM helper: h('div', {class:'x', onclick:fn}, child, 'text')
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === false || v == null) continue;
      if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
      else if (k === 'class') e.className = v;
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
    return e;
  }

  // ── Card images ──────────────────────────────────────────────────────────
  // The server injects name->image URL into the stock page; reuse it.
  async function loadImages() {
    try {
      const t = await (await fetch('/classic', {cache:'force-cache'})).text();
      const i = t.indexOf('const CARD_IMAGES = ');
      if (i < 0) return;
      const s = i + 'const CARD_IMAGES = '.length;
      const e = t.indexOf(';\n', s);
      Object.assign(IMG, JSON.parse(t.slice(s, e)));
      NAMES = Object.keys(IMG).sort((a, b) => b.length - a.length);
      if (frame) render();
    } catch (_) { /* images are optional */ }
  }

  function cardEl(o, big) {
    const url = IMG[o.name];
    const c = h('div', {class: 'card' + (big ? ' big' : '') + (o.exhausted ? ' ex' : '') + (url ? '' : ' noimg') +
      (o.controller ? (o.controller === me ? ' deco-me' : ' deco-foe') : ''), onclick: () => preview(o)});
    if (url) {
      const img = h('img', {src: url, alt: o.name, loading: 'lazy', decoding: 'async'});
      img.addEventListener('error', () => { img.remove(); c.classList.add('noimg'); });
      c.append(img);
    }
    c.append(h('span', {class: 'nm'}, o.name));
    if (o.might) c.append(h('span', {class: 'b might', title: 'Might'}, o.might));
    if (o.damage) c.append(h('span', {class: 'b dmg', title: '피해'}, '-' + o.damage));
    if (o.exhausted) c.append(h('span', {class: 'exh'}, '탭됨'));
    return c;
  }

  function preview(o) {
    const url = IMG[o.name];
    $('mimg').style.display = url ? '' : 'none';
    if (url) $('mimg').src = url;
    $('mcap').textContent = o.name + (o.might ? '  ·  Might ' + o.might : '') + (o.damage ? '  ·  피해 ' + o.damage : '');
    $('modal').classList.add('show');
  }
  $('modal').addEventListener('click', () => $('modal').classList.remove('show'));

  function row(objs, big) {
    const r = h('div', {class: 'row' + (objs.length ? '' : ' empty')});
    for (const o of objs) r.append(cardEl(o, big));
    return r;
  }

  const lane = (label, objs, big) => h('div', {class: 'lane'}, h('div', {class: 'lane-l'}, label), row(objs, big));

  // ── Rendering ────────────────────────────────────────────────────────────
  const other = p => (p === 'P1' ? 'P2' : 'P1');
  const chip = (k, v) => h('span', {class: 'chip'}, k + ' ', h('b', {}, v));

  function legendChampion(text, who) {
    // The zones object has no legend/champion; pull them from the text board.
    const out = [];
    if (!text) return out;
    const lines = text.split('\n');
    const start = lines.findIndex(l => l.startsWith('| ' + who + ' '));
    if (start < 0) return out;
    for (let i = start; i < Math.min(start + 4, lines.length); i++) {
      const m = lines[i].match(/(Legend|Champion) Zone:\s+(.+?)\s+\[/);
      if (m) out.push(m[1] + ': ' + m[2]);
    }
    return out;
  }

  function playerPanel(m, who, mine) {
    const z = (m.zones || {})[who] || {};
    const sec = h('section');
    sec.append(h('div', {class: 'sec-h ' + (mine ? 'me-h' : 'foe-h')},
      (mine ? '나' : '상대') + ' (' + who + ')',
      h('span', {class: 'tag'}, (m.turn && m.turn.turn_player === who) ? '이번 턴' : '')));
    const chips = h('div', {class: 'chips'},
      chip('손패', z.hand_count ?? (z.hand || []).length), chip('덱', z.main_deck_count ?? '?'),
      chip('룬덱', z.rune_deck_count ?? '?'), chip('에너지', z.energy ?? 0), chip('파워', z.power_total ?? 0));
    sec.append(chips);
    const lc = legendChampion(m.render_text, who);
    if (lc.length) sec.append(h('div', {class: 'chips'}, lc.map(t => h('span', {class: 'chip'}, t))));
    sec.append(lane('기지', z.base || [], false));
    if (mine) sec.append(lane('손패', z.hand || [], true));
    else if ((z.hand || []).length) sec.append(lane('손패', z.hand, false));
    return sec;
  }

  function battlefields(m) {
    const sec = h('section', {}, h('div', {class: 'sec-h'}, '전장'));
    for (const b of (m.battlefields || [])) {
      const cls = b.controller === 'none' ? 'ctl-none' : (b.controller === me ? 'ctl-me' : 'ctl-foe');
      const lab = b.controller === 'none' ? '미점령' : (b.controller === me ? '내가 점령' : '상대 점령');
      const units = b.units || [];
      sec.append(h('div', {class: 'bf'},
        h('div', {class: 'bf-h'}, h('b', {}, b.name), h('span', {class: cls}, lab)),
        lane('상대', units.filter(u => u.controller !== me), false),
        lane('나', units.filter(u => u.controller === me), false)));
    }
    return sec;
  }

  function index(m) {
    const idx = new Map();
    const add = o => { if (o && o.id != null) idx.set(o.id, o); };
    for (const p of ['P1', 'P2']) {
      const z = (m.zones || {})[p] || {};
      for (const k of ['hand', 'base', 'trash', 'banishment', 'main_deck', 'rune_deck']) (z[k] || []).forEach(add);
    }
    for (const b of (m.battlefields || [])) (b.units || []).forEach(add);
    return idx;
  }

  function actionCard(a, idx) {
    if (a.card_object_id != null && idx.has(a.card_object_id)) return idx.get(a.card_object_id).name;
    return NAMES.find(n => a.label.includes(n)) || null;
  }

  function renderActions(m) {
    const acts = $('acts'), status = $('status'), prompt = $('prompt');
    acts.replaceChildren(); prompt.hidden = true; status.className = ''; status.replaceChildren();
    if (m.game_over) {
      const won = m.winner === me, draw = !m.winner || m.winner === 'none';
      status.append(h('div', {class: 'banner ' + (draw ? '' : won ? 'win' : 'lose')},
        draw ? '게임 종료' : won ? '승리!' : '패배'), m.game_over_reason || '');
      return;
    }
    const legal = m.type === 'decision' ? (m.legal || []) : [];
    if (!legal.length) {
      status.append(h('span', {class: 'spin'}), m.engine_busy ? '상대/엔진이 진행 중…' : '대기 중…');
      return;
    }
    status.className = 'me';
    status.textContent = pending ? '처리 중…' : '내 선택 차례 · ' + legal.length + '개 선택지';
    if (m.prompt) { prompt.textContent = m.prompt; prompt.hidden = false; }
    const idx = index(m);
    const sorted = legal.slice().sort((a, b) => (/EndTurn|Pass/i.test(a.type) ? 1 : 0) - (/EndTurn|Pass/i.test(b.type) ? 1 : 0));
    for (const a of sorted) {
      const nm = actionCard(a, idx), url = nm && IMG[nm];
      acts.append(h('button', {class: 'act' + (/EndTurn/i.test(a.type) ? ' end' : ''), disabled: pending,
        onclick: () => choose(m, a)}, url && h('img', {src: url, alt: '', loading: 'lazy'}), h('span', {class: 't'}, a.label)));
    }
  }

  function render() {
    const m = frame; if (!m) return;
    const t = m.turn || {};
    $('turn').textContent = t.turn_number != null ? ('턴 ' + t.turn_number + ' · ' + (t.phase_name || '') + ' · ' +
      (t.turn_player === me ? '내 턴' : '상대 턴')) : '';
    const mine = t[me.toLowerCase() + '_score'], theirs = t[other(me).toLowerCase() + '_score'];
    $('score').replaceChildren(h('span', {class: 'me'}, mine ?? 0), ' : ', h('span', {class: 'foe'}, theirs ?? 0),
      h('span', {style: 'color:var(--mut);font-weight:400;font-size:12px'}, ' /' + (t.victory_score ?? 8)));
    const main = $('main'), keep = main.scrollTop;
    main.replaceChildren(
      playerPanel(m, other(me), false), battlefields(m), playerPanel(m, me, true),
      h('section', {}, h('details', {}, h('summary', {}, '텍스트 보드 보기'), h('pre', {}, m.render_text || '')),
        h('div', {style: 'margin-top:8px'}, h('a', {class: 'classic', href: '/classic'}, '기존(PC용) 화면으로 열기'))));
    main.scrollTop = keep;
    renderActions(m);
  }

  // ── Networking ───────────────────────────────────────────────────────────
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.id); toast.id = setTimeout(() => (t.style.display = 'none'), 3500);
  }

  function choose(m, a) {
    if (pending || !ws || ws.readyState !== 1) return;
    if (/EndTurn/i.test(a.type) && !confirm('턴을 종료할까요?')) return;
    pending = true;
    ws.send(JSON.stringify({type: 'choose', player: m.player, index: a.index, decision_id: m.decision_id}));
    renderActions(m);
  }

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws' + location.search);
    ws.onopen = () => { retry = 0; $('dot').classList.add('on'); ws.send('{"type":"request_state"}'); };
    ws.onclose = () => {
      $('dot').classList.remove('on'); $('turn').textContent = '연결이 끊겼어요, 다시 연결 중…';
      setTimeout(connect, Math.min(1000 * ++retry, 5000));
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
      if (m.type === 'decision' || m.type === 'state') {
        if (m.type === 'decision' && m.legal && m.legal.length) me = m.player || me;
        pending = false; frame = m; render();
      } else if (m.type === 'err') { pending = false; toast(m.msg || '오류'); if (frame) render(); }
    };
  }

  loadImages();
  connect();
})();
</script>
</body>
</html>
